name: day1-mlx-extraction

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-day1:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face and MLX artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/mlx
          key: ${{ runner.os }}-hf-mlx-${{ hashFiles('requirements.txt', 'run_all.py', 'experiments/*.py', 'models/*.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-mlx-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Day 1 experiments
        env:
          HF_HOME: ~/.cache/huggingface
        run: |
          python run_all.py

      - name: Upload result artifacts
        uses: actions/upload-artifact@v4
        with:
          name: day1-results
          path: |
            results/*.csv
            results/*.png
