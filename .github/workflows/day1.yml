name: day1-extraction

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-day1:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PYTHONHASHSEED: "0"
      MPLBACKEND: "Agg"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt', 'experiments/day1.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all experiments
        run: |
          python run_all.py --config experiments/day1.yaml --output results

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: day1-results
          path: |
            results/results_raw.csv
            results/results_summary.csv
            results/qwen_topk_sweep_summary.csv
            results/agreement_vs_budget.png
            results/kl_vs_budget.png
